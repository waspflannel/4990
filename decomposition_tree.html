<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SP Decomposition Tree</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #1a1816;
  --surface: #242220;
  --surface-muted: #1e1c1a;
  --border: #3a3632;
  --border-accent: #4a453f;
  --text: #e8e4df;
  --text-muted: #9a9389;
  --text-dim: #5a5550;
  --series: #6a9fd8;
  --series-bg: rgba(106, 159, 216, 0.15);
  --parallel: #e07a5a;
  --parallel-bg: rgba(224, 122, 90, 0.15);
  --edge: #7ab88a;
  --edge-bg: rgba(122, 184, 138, 0.15);
  --accent: #6a9fd8;
  --edge-stroke: #4a453f;
  --font-serif: 'Source Serif 4', Georgia, serif;
  --font-sans: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'IBM Plex Mono', 'Cascadia Code', monospace;
  --radius: 8px;
}

html { background: var(--bg); color-scheme: dark; }

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ─── Header ─── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  display: flex;
  align-items: baseline;
  gap: 10px;
}

header h1 {
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.01em;
}

header h1 .title-light {
  font-weight: 400;
  color: var(--text-muted);
}

header .subtitle {
  font-size: 12px;
  color: var(--text-dim);
  margin-left: auto;
  font-family: var(--font-mono);
  letter-spacing: 0.02em;
}

/* ─── Main Layout ─── */
.app {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ─── Sidebar ─── */
.sidebar {
  width: 340px;
  min-width: 340px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.sidebar-section {
  padding: 16px;
  border-bottom: 1px solid var(--border);
}

.sidebar-section:last-child { border-bottom: none; }

.section-label {
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 10px;
}

textarea {
  width: 100%;
  height: 100px;
  background: var(--surface-muted);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 10px 12px;
  resize: vertical;
  line-height: 1.5;
  transition: border-color 0.15s, box-shadow 0.15s;
}

textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(106, 159, 216, 0.25);
}

textarea::placeholder {
  color: var(--text-dim);
}

/* ─── Buttons ─── */
.btn-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.btn {
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  padding: 7px 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.15s;
  background: var(--surface);
  color: var(--text);
}

.btn:hover { background: var(--surface-muted); border-color: var(--border-accent); }

.btn-primary {
  background: var(--accent);
  color: #1a1816;
  border-color: var(--accent);
  font-weight: 600;
}

.btn-primary:hover {
  background: #7db0e2;
  border-color: #7db0e2;
  color: #1a1816;
}

select {
  font-family: var(--font-sans);
  font-size: 13px;
  padding: 7px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
}

select:focus { outline: none; border-color: var(--accent); }

/* ─── Error / Success ─── */
.error {
  display: none;
  margin-top: 8px;
  padding: 8px 12px;
  border-radius: 6px;
  background: rgba(163, 58, 47, 0.12);
  border: 1px solid rgba(163, 58, 47, 0.3);
  color: #e07a6a;
  font-size: 12px;
  font-family: var(--font-mono);
}

.error.visible { display: block; }

.success {
  display: none;
  margin-top: 8px;
  padding: 8px 12px;
  border-radius: 6px;
  background: rgba(61, 122, 74, 0.12);
  border: 1px solid rgba(61, 122, 74, 0.3);
  color: #7ab88a;
  font-size: 12px;
  font-family: var(--font-mono);
  word-break: break-all;
}

.success.visible { display: block; }

/* ─── Controls ─── */
.controls {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.ctrl-btn {
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface-muted);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 14px;
  transition: all 0.15s;
}

.ctrl-btn:hover { background: var(--border); color: var(--text); border-color: var(--border-accent); }

.ctrl-btn:disabled { opacity: 0.3; cursor: default; }
.ctrl-btn:disabled:hover { background: var(--surface-muted); color: var(--text-muted); border-color: var(--border); }

#btnPlay { width: 36px; height: 36px; }

.ctrl-btn.playing {
  background: var(--series-bg);
  border-color: var(--accent);
  color: var(--accent);
}

.speed-group {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
}

.speed-group label {
  font-size: 11px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

input[type="range"] {
  -webkit-appearance: none;
  width: 80px;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  outline: none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}

.step-info {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 8px;
}

/* ─── Legend ─── */
.legend {
  display: flex;
  gap: 16px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-muted);
}

.legend-shape {
  border: 1.5px solid;
}

.legend-shape.s, .legend-shape.p {
  width: 22px; height: 14px;
  border-radius: 7px;
}

.legend-shape.s { border-color: var(--series); background: var(--series-bg); }
.legend-shape.p { border-color: var(--parallel); background: var(--parallel-bg); }

.legend-shape.e {
  width: 14px; height: 14px;
  border-radius: 50%;
  border-color: var(--edge); background: var(--edge-bg);
}

.legend-label { font-family: var(--font-mono); font-size: 11px; font-weight: 500; }

/* ─── Canvas ─── */
.canvas {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: auto;
  background-color: var(--surface-muted);
  background-image: radial-gradient(circle, #2e2a27 0.7px, transparent 0.7px);
  background-size: 24px 24px;
  position: relative;
}

.canvas .empty-state {
  text-align: center;
  color: var(--text-dim);
}

.canvas .empty-state .empty-illustration {
  margin-bottom: 16px;
  opacity: 0.5;
}

.canvas .empty-state p {
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-muted);
}

.canvas .empty-state .empty-hint {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 6px;
}

svg {
  display: block;
}

/* ─── SVG Nodes ─── */
svg .tree-edge {
  stroke: var(--edge-stroke);
  stroke-width: 1.2;
  stroke-linecap: round;
  fill: none;
  opacity: 0;
  transition: opacity 0.35s ease;
}

svg .tree-edge.visible {
  opacity: 1;
}

svg .node-group {
  opacity: 0;
  transform: scale(0.85);
  transition: opacity 0.35s ease, transform 0.35s ease;
  transform-box: fill-box;
  transform-origin: center;
}

svg .node-group.visible {
  opacity: 1;
  transform: scale(1);
}

svg .node-shape {
  stroke-width: 1.5;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
}

svg .node-shape.s-node {
  fill: var(--series-bg);
  stroke: var(--series);
}

svg .node-shape.p-node {
  fill: var(--parallel-bg);
  stroke: var(--parallel);
}

svg .node-shape.e-node {
  fill: var(--edge-bg);
  stroke: var(--edge);
}

svg .node-label {
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 600;
  text-anchor: middle;
  dominant-baseline: central;
  pointer-events: none;
}

svg .node-label.s-label { fill: var(--series); }
svg .node-label.p-label { fill: var(--parallel); }
svg .node-label.e-label { fill: var(--edge); }

svg .node-sublabel {
  font-family: var(--font-mono);
  font-size: 10px;
  text-anchor: middle;
  dominant-baseline: hanging;
  pointer-events: none;
}

svg .node-sublabel.s-sub { fill: var(--series); }
svg .node-sublabel.p-sub { fill: var(--parallel); }
svg .node-sublabel.e-sub { fill: var(--edge); }

/* ─── Scrollbar ─── */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-accent); }
</style>
</head>
<body>

<header>
  <h1>SP Decomposition <span class="title-light">Tree Visualizer</span></h1>
  <span class="subtitle">series-parallel graphs</span>
</header>

<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="section-label">Expression Input</div>
      <textarea id="exprInput" placeholder="SC(e(0,1),e(1,2))&#10;Paste an SP expression here..." spellcheck="false"></textarea>
      <div class="btn-row">
        <button class="btn btn-primary" id="parseBtn">Parse &amp; Visualize</button>
        <select id="exampleSelect">
          <option value="">Load Example...</option>
          <option value="SC(e(0,1),e(1,2))">Simple Series</option>
          <option value="PC(SC(e(0,1),e(1,2)),e(0,2))">Parallel + Series</option>
          <option value="SC(PC(SC(e(2,3),e(3,4)),e(2,4)),SC(e(0,2),e(2,5)))">Deeper Tree</option>
          <option value="SC(SC(e(0,1),e(1,2)),SC(e(2,3),e(3,4)))">Chain of 4</option>
          <option value="PC(PC(e(0,1),e(0,1)),PC(e(0,1),e(0,1)))">Full Parallel</option>
        </select>
      </div>
      <div class="error" id="errorArea"></div>
      <div class="success" id="successArea"></div>
    </div>

    <div class="sidebar-section">
      <div class="section-label">Animation</div>
      <div class="controls">
        <button class="ctrl-btn" id="btnReset" title="Reset" disabled>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="1" y="2" width="2" height="10" rx="0.5"/><path d="M12 2L5 7l7 5z"/></svg>
        </button>
        <button class="ctrl-btn" id="btnBack" title="Step Back" disabled>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M10 2L3 7l7 5z"/></svg>
        </button>
        <button class="ctrl-btn" id="btnPlay" title="Play/Pause" disabled>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M4 2l8 5-8 5z"/></svg>
        </button>
        <button class="ctrl-btn" id="btnForward" title="Step Forward" disabled>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M4 2l7 5-7 5z"/></svg>
        </button>
        <button class="ctrl-btn" id="btnEnd" title="Skip to End" disabled>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M2 2l7 5-7 5z"/><rect x="11" y="2" width="2" height="10" rx="0.5"/></svg>
        </button>
        <div class="speed-group">
          <label>Speed</label>
          <input type="range" id="speedSlider" min="100" max="2000" value="500" step="100">
        </div>
      </div>
      <div class="step-info" id="stepInfo">No tree loaded</div>
    </div>

    <div class="sidebar-section">
      <div class="section-label">Legend</div>
      <div class="legend">
        <div class="legend-item"><div class="legend-shape s"></div><span class="legend-label">S</span> Series</div>
        <div class="legend-item"><div class="legend-shape p"></div><span class="legend-label">P</span> Parallel</div>
        <div class="legend-item"><div class="legend-shape e"></div><span class="legend-label">e</span> Edge</div>
      </div>
    </div>
  </div>

  <!-- Canvas -->
  <div class="canvas" id="canvasArea">
    <div class="empty-state" id="emptyState">
      <div class="empty-illustration">
        <svg width="120" height="100" viewBox="0 0 120 100" fill="none">
          <rect x="36" y="4" width="48" height="28" rx="12" stroke="#4a453f" stroke-width="1.5" stroke-dasharray="4 3"/>
          <circle cx="30" cy="80" r="16" stroke="#4a453f" stroke-width="1.5" stroke-dasharray="4 3"/>
          <circle cx="90" cy="80" r="16" stroke="#4a453f" stroke-width="1.5" stroke-dasharray="4 3"/>
          <path d="M48 32 C48 56, 30 56, 30 64" stroke="#4a453f" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
          <path d="M72 32 C72 56, 90 56, 90 64" stroke="#4a453f" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
        </svg>
      </div>
      <p>Enter an SP expression to visualize<br>its decomposition tree</p>
      <p class="empty-hint">Try one of the examples from the sidebar</p>
    </div>
  </div>
</div>

<script>
// ──────────────────── SVG Icon Strings ────────────────────
const ICON_PLAY = '<svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M4 2l8 5-8 5z"/></svg>';
const ICON_PAUSE = '<svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="3" y="2" width="3" height="10" rx="1"/><rect x="8" y="2" width="3" height="10" rx="1"/></svg>';

// ──────────────────── Parser ────────────────────
function parse(input) {
  const str = input.replace(/\s+/g, '');
  let pos = 0;

  function peek() { return pos < str.length ? str[pos] : null; }
  function advance() { return str[pos++]; }

  function expect(ch) {
    if (pos >= str.length || str[pos] !== ch)
      throw new Error(`Expected '${ch}' at position ${pos}, got '${str[pos] || 'EOF'}'`);
    pos++;
  }

  function parseNum() {
    let start = pos;
    while (pos < str.length && str[pos] >= '0' && str[pos] <= '9') pos++;
    if (pos === start) throw new Error(`Expected number at position ${pos}`);
    return parseInt(str.substring(start, pos), 10);
  }

  function parseExpr() {
    if (str.startsWith('SC(', pos)) {
      pos += 3;
      const left = parseExpr();
      expect(',');
      const right = parseExpr();
      expect(')');
      return { type: 'S', left, right };
    }
    if (str.startsWith('PC(', pos)) {
      pos += 3;
      const left = parseExpr();
      expect(',');
      const right = parseExpr();
      expect(')');
      return { type: 'P', left, right };
    }
    if (str.startsWith('e(', pos)) {
      pos += 2;
      const src = parseNum();
      expect(',');
      const sink = parseNum();
      expect(')');
      return { type: 'e', src, sink };
    }
    throw new Error(`Unexpected token at position ${pos}: '${str.substring(pos, pos + 10)}'`);
  }

  const tree = parseExpr();
  if (pos < str.length) throw new Error(`Unexpected content at position ${pos}: '${str.substring(pos)}'`);
  return tree;
}

// ──────────────────── Layout ────────────────────
const H_SPACING = 70;
const V_SPACING = 80;
const SP_W = 48, SP_H = 32, SP_RX = 12;
const LEAF_R = 18;

function layoutTree(root) {
  let leafIndex = 0;
  const nodes = [];

  // Assign IDs and collect nodes
  let id = 0;
  function assignIds(node, depth, parent) {
    node.id = id++;
    node.depth = depth;
    node.parent = parent;
    if (node.type === 'e') {
      node.x = leafIndex * H_SPACING;
      node.y = depth * V_SPACING;
      leafIndex++;
    } else {
      assignIds(node.left, depth + 1, node);
      assignIds(node.right, depth + 1, node);
      node.x = (node.left.x + node.right.x) / 2;
      node.y = depth * V_SPACING;
    }
    nodes.push(node);
  }

  assignIds(root, 0, null);
  return nodes; // post-order: leaves first, root last
}

// ──────────────────── Render ────────────────────
let treeNodes = [];
let currentStep = 0;
let totalSteps = 0;
let playInterval = null;

const canvasArea = document.getElementById('canvasArea');
const emptyState = document.getElementById('emptyState');
const stepInfo = document.getElementById('stepInfo');
const errorArea = document.getElementById('errorArea');
const successArea = document.getElementById('successArea');
const exprInput = document.getElementById('exprInput');
const btnReset = document.getElementById('btnReset');
const btnBack = document.getElementById('btnBack');
const btnPlay = document.getElementById('btnPlay');
const btnForward = document.getElementById('btnForward');
const btnEnd = document.getElementById('btnEnd');
const speedSlider = document.getElementById('speedSlider');
const exampleSelect = document.getElementById('exampleSelect');
const parseBtn = document.getElementById('parseBtn');

function showError(msg) {
  errorArea.textContent = msg;
  errorArea.classList.add('visible');
}

function clearError() {
  errorArea.classList.remove('visible');
  errorArea.textContent = '';
  successArea.classList.remove('visible');
  successArea.textContent = '';
}

function renderTree(nodes) {
  // Remove old SVG
  const oldSvg = canvasArea.querySelector('svg');
  if (oldSvg) oldSvg.remove();
  emptyState.style.display = 'none';

  if (!nodes.length) return;

  // Compute bounding box with mixed shapes
  const pad = 60;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const n of nodes) {
    if (n.type === 'e') {
      minX = Math.min(minX, n.x - LEAF_R);
      maxX = Math.max(maxX, n.x + LEAF_R);
      minY = Math.min(minY, n.y - LEAF_R);
      maxY = Math.max(maxY, n.y + LEAF_R + 18);
    } else {
      minX = Math.min(minX, n.x - SP_W / 2);
      maxX = Math.max(maxX, n.x + SP_W / 2);
      minY = Math.min(minY, n.y - SP_H / 2);
      maxY = Math.max(maxY, n.y + SP_H / 2 + 18);
    }
  }
  const vbX = minX - pad;
  const vbY = minY - pad;
  const vbW = maxX - minX + pad * 2;
  const vbH = maxY - minY + pad * 2;

  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');

  // Scale SVG to fit canvas, with max size limits
  const canvasRect = canvasArea.getBoundingClientRect();
  const scaleX = canvasRect.width / vbW;
  const scaleY = canvasRect.height / vbH;
  const scale = Math.min(scaleX, scaleY, 1.5);

  svg.setAttribute('width', Math.max(vbW * scale, canvasRect.width));
  svg.setAttribute('height', Math.max(vbH * scale, canvasRect.height));
  svg.setAttribute('viewBox', `${vbX} ${vbY} ${vbW} ${vbH}`);
  svg.style.margin = 'auto';

  // Draw edges first (behind nodes) — cubic bezier curves
  for (const n of nodes) {
    if (n.type !== 'e') {
      for (const child of [n.left, n.right]) {
        const px = n.x;
        const py = n.y + SP_H / 2; // exit bottom of parent rect
        const cx = child.x;
        const cy = child.type === 'e' ? child.y - LEAF_R : child.y - SP_H / 2; // enter top of child shape
        const midY = (py + cy) / 2;
        const d = `M ${px} ${py} C ${px} ${midY}, ${cx} ${midY}, ${cx} ${cy}`;

        const path = document.createElementNS(svgNS, 'path');
        path.setAttribute('d', d);
        path.classList.add('tree-edge');
        path.dataset.parentId = n.id;
        path.dataset.childId = child.id;
        svg.appendChild(path);
      }
    }
  }

  // Draw nodes
  for (const n of nodes) {
    const g = document.createElementNS(svgNS, 'g');
    g.classList.add('node-group');
    g.dataset.nodeId = n.id;

    if (n.type === 'e') {
      // Leaf nodes: circles
      const circle = document.createElementNS(svgNS, 'circle');
      circle.setAttribute('cx', n.x);
      circle.setAttribute('cy', n.y);
      circle.setAttribute('r', LEAF_R);
      circle.classList.add('node-shape', 'e-node');
      g.appendChild(circle);
    } else {
      // S/P nodes: rounded rectangles (pill shape)
      const rect = document.createElementNS(svgNS, 'rect');
      rect.setAttribute('x', n.x - SP_W / 2);
      rect.setAttribute('y', n.y - SP_H / 2);
      rect.setAttribute('width', SP_W);
      rect.setAttribute('height', SP_H);
      rect.setAttribute('rx', SP_RX);
      rect.classList.add('node-shape', n.type === 'S' ? 's-node' : 'p-node');
      g.appendChild(rect);
    }

    const label = document.createElementNS(svgNS, 'text');
    label.setAttribute('x', n.x);
    label.setAttribute('y', n.y);
    label.classList.add('node-label');
    if (n.type === 'S') { label.classList.add('s-label'); label.textContent = 'S'; }
    else if (n.type === 'P') { label.classList.add('p-label'); label.textContent = 'P'; }
    else { label.classList.add('e-label'); label.textContent = 'e'; }
    g.appendChild(label);

    // Sublabel
    const sub = document.createElementNS(svgNS, 'text');
    const subY = n.type === 'e' ? n.y + LEAF_R + 6 : n.y + SP_H / 2 + 6;
    sub.setAttribute('x', n.x);
    sub.setAttribute('y', subY);
    sub.classList.add('node-sublabel');
    if (n.type === 'e') {
      sub.classList.add('e-sub');
      sub.textContent = `(${n.src},${n.sink})`;
    } else if (n.type === 'S') {
      sub.classList.add('s-sub');
      sub.textContent = 'series';
    } else {
      sub.classList.add('p-sub');
      sub.textContent = 'parallel';
    }
    g.appendChild(sub);

    svg.appendChild(g);
  }

  canvasArea.appendChild(svg);
}

function updateVisibility() {
  const svg = canvasArea.querySelector('svg');
  if (!svg) return;

  // Which node IDs are visible at currentStep
  const visibleIds = new Set();
  for (let i = 0; i < currentStep && i < treeNodes.length; i++) {
    visibleIds.add(treeNodes[i].id);
  }

  // Show/hide node groups
  svg.querySelectorAll('.node-group').forEach(g => {
    const nid = parseInt(g.dataset.nodeId, 10);
    g.classList.toggle('visible', visibleIds.has(nid));
  });

  // Show edge only if BOTH parent and child are visible
  svg.querySelectorAll('.tree-edge').forEach(el => {
    const pid = parseInt(el.dataset.parentId, 10);
    const cid = parseInt(el.dataset.childId, 10);
    el.classList.toggle('visible', visibleIds.has(pid) && visibleIds.has(cid));
  });

  // Update step info
  stepInfo.textContent = totalSteps > 0
    ? `Step ${currentStep} of ${totalSteps}`
    : 'No tree loaded';

  // Update button states
  const hasPrev = currentStep > 0;
  const hasNext = currentStep < totalSteps;
  btnReset.disabled = !hasPrev;
  btnBack.disabled = !hasPrev;
  btnForward.disabled = !hasNext;
  btnEnd.disabled = !hasNext;
}

// ──────────────────── Controls ────────────────────
function stopPlay() {
  if (playInterval) {
    clearInterval(playInterval);
    playInterval = null;
    btnPlay.classList.remove('playing');
    btnPlay.innerHTML = ICON_PLAY;
  }
}

function doParse() {
  stopPlay();
  clearError();
  const input = exprInput.value.trim();
  if (!input) { showError('Enter an expression first.'); return; }

  let tree;
  try {
    tree = parse(input);
  } catch (e) {
    showError(e.message);
    return;
  }

  treeNodes = layoutTree(tree);
  totalSteps = treeNodes.length;
  currentStep = 0;
  renderTree(treeNodes);
  updateVisibility();
  enableControls(true);

  successArea.textContent = 'Loaded: ' + input;
  successArea.classList.add('visible');
}

function enableControls(enabled) {
  btnPlay.disabled = !enabled;
  if (enabled) updateVisibility(); // updates other buttons
}

parseBtn.addEventListener('click', doParse);

exprInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doParse(); }
});

exampleSelect.addEventListener('change', () => {
  if (exampleSelect.value) {
    exprInput.value = exampleSelect.value;
    exampleSelect.value = '';
    doParse();
  }
});

btnReset.addEventListener('click', () => { stopPlay(); currentStep = 0; updateVisibility(); });

btnBack.addEventListener('click', () => {
  stopPlay();
  if (currentStep > 0) { currentStep--; updateVisibility(); }
});

btnForward.addEventListener('click', () => {
  stopPlay();
  if (currentStep < totalSteps) { currentStep++; updateVisibility(); }
});

btnEnd.addEventListener('click', () => { stopPlay(); currentStep = totalSteps; updateVisibility(); });

btnPlay.addEventListener('click', () => {
  if (playInterval) {
    stopPlay();
    return;
  }
  if (currentStep >= totalSteps) currentStep = 0;
  btnPlay.classList.add('playing');
  btnPlay.innerHTML = ICON_PAUSE;
  const speed = 2100 - parseInt(speedSlider.value, 10);
  playInterval = setInterval(() => {
    if (currentStep < totalSteps) {
      currentStep++;
      updateVisibility();
    } else {
      stopPlay();
    }
  }, speed);
});

speedSlider.addEventListener('input', () => {
  if (playInterval) {
    stopPlay();
    btnPlay.click(); // restart with new speed
  }
});
</script>
</body>
</html>
