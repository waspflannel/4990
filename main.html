<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SP Decomposition Tree Visualizer</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <div class="header-left">
    <h1>SP Decomposition <span class="title-accent">Tree</span></h1>
    <span class="subtitle">series-parallel graph visualizer</span>
  </div>
  <div class="header-right">
    <button class="theme-toggle" id="themeToggle" title="Toggle theme">
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </div>
</header>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-inner">

      <section class="sidebar-section">
        <h3 class="section-label">Expression</h3>
        <textarea id="exprInput" placeholder="SC(e(0,1),e(1,2))&#10;Paste an SP expression here..." spellcheck="false"></textarea>
        <div class="btn-row">
          <button class="btn btn-primary" id="parseBtn">Visualize</button>
          <select id="exampleSelect">
            <option value="">Examples...</option>
            <option value="SC(e(0,1),e(1,2))">Simple Series</option>
            <option value="PC(SC(e(0,1),e(1,2)),e(0,2))">Parallel + Series</option>
            <option value="SC(PC(SC(e(2,3),e(3,4)),e(2,4)),SC(e(0,2),e(2,5)))">Nested Tree</option>
            <option value="SC(SC(e(0,1),e(1,2)),SC(e(2,3),e(3,4)))">Chain of 4</option>
            <option value="PC(PC(e(0,1),e(0,1)),PC(e(0,1),e(0,1)))">Full Parallel</option>
          </select>
        </div>
        <div class="message error" id="errorArea"></div>
        <div class="message success" id="successArea"></div>
      </section>

      <section class="sidebar-section">
        <h3 class="section-label">Animation</h3>
        <div class="controls">
          <button class="ctrl-btn" id="btnReset" title="Reset" disabled>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="1" y="2" width="2" height="10" rx="0.5"/><path d="M12 2L5 7l7 5z"/></svg>
          </button>
          <button class="ctrl-btn" id="btnBack" title="Step Back" disabled>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M10 2L3 7l7 5z"/></svg>
          </button>
          <button class="ctrl-btn btn-play" id="btnPlay" title="Play/Pause" disabled>
            <svg class="play-icon" width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M4 2l8 5-8 5z"/></svg>
            <svg class="pause-icon" width="14" height="14" viewBox="0 0 14 14" fill="currentColor" style="display:none"><rect x="3" y="2" width="3" height="10" rx="1"/><rect x="8" y="2" width="3" height="10" rx="1"/></svg>
          </button>
          <button class="ctrl-btn" id="btnForward" title="Step Forward" disabled>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M4 2l7 5-7 5z"/></svg>
          </button>
          <button class="ctrl-btn" id="btnEnd" title="Skip to End" disabled>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M2 2l7 5-7 5z"/><rect x="11" y="2" width="2" height="10" rx="0.5"/></svg>
          </button>
          <div class="speed-group">
            <label>Speed</label>
            <input type="range" id="speedSlider" min="100" max="2000" value="500" step="100">
          </div>
        </div>
        <div class="step-info" id="stepInfo">No tree loaded</div>
      </section>

      <section class="sidebar-section" id="inspectorSection">
        <h3 class="section-label">Node Inspector</h3>
        <div id="inspector">
          <p class="inspector-empty">Click a node to inspect</p>
        </div>
      </section>

      <section class="sidebar-section">
        <h3 class="section-label">Legend</h3>
        <div class="legend">
          <div class="legend-item">
            <div class="legend-dot series"></div>
            <span>Series (SC)</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot parallel"></div>
            <span>Parallel (PC)</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot edge"></div>
            <span>Edge (e)</span>
          </div>
        </div>
      </section>

    </div>
    <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 3L5 8l5 5"/></svg>
    </button>
  </aside>

  <main class="canvas" id="canvasArea">
    <div class="empty-state" id="emptyState">
      <div class="empty-illustration">
        <svg width="120" height="100" viewBox="0 0 120 100" fill="none">
          <rect x="36" y="4" width="48" height="28" rx="12" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="4 3"/>
          <circle cx="30" cy="80" r="16" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="4 3"/>
          <circle cx="90" cy="80" r="16" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="4 3"/>
          <path d="M48 32 C48 56, 30 56, 30 64" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
          <path d="M72 32 C72 56, 90 56, 90 64" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
        </svg>
      </div>
      <p>Enter an SP expression to visualize<br>its decomposition tree</p>
      <p class="empty-hint">Try one of the examples from the sidebar</p>
    </div>

    <svg id="treeSvg" style="display:none;" width="100%" height="100%">
      <g id="viewport">
        <g class="edges-layer"></g>
        <g class="nodes-layer"></g>
      </g>
    </svg>

    <div class="canvas-controls" id="canvasControls" style="display:none;">
      <button class="canvas-btn" id="btnFitView" title="Fit to view">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="2" y="2" width="10" height="10" rx="1"/><path d="M5 7h4M7 5v4"/></svg>
      </button>
      <button class="canvas-btn" id="btnResetLayout" title="Reset node positions">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 7a6 6 0 0 1 11-3M13 7a6 6 0 0 1-11 3"/><path d="M1 2v5h4M13 12V7H9" fill="none"/></svg>
      </button>
      <div class="canvas-divider"></div>
      <button class="canvas-btn" id="btnZoomOut" title="Zoom out">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="4" y1="7" x2="10" y2="7"/></svg>
      </button>
      <span class="zoom-level" id="zoomLevel" title="Click to reset zoom">100%</span>
      <button class="canvas-btn" id="btnZoomIn" title="Zoom in">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="7" y1="4" x2="7" y2="10"/><line x1="4" y1="7" x2="10" y2="7"/></svg>
      </button>
    </div>
  </main>
</div>

<script src="js/parser.js"></script>
<script src="js/layout.js"></script>
<script src="js/renderer.js"></script>
<script src="js/canvas.js"></script>
</body>
</html>
